<style>
:root {

  --brand: #1f5f8b; --brand-ink: #ffffff; --brand-tint: #e6f0f7;
  --side: #14324a; --side-ink: #d7e3ee;
  --bronze: #a8692f; --silver: #7d8a9c; --gold: #b8901a; --platinum: #2f7f86;
  --red: #b33a4a; --green: #2b8a5a;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#0f151d; --surface:#17202b; --ink:#e6ecf2; --soft:#9aa8b8; --line:#2a3644; --brand:#4d9bd0; --brand-ink:#0b1520; --brand-tint:#16304a; --side:#0b1218; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg:#0f151d; --surface:#17202b; --ink:#e6ecf2; --soft:#9aa8b8; --line:#2a3644; --brand:#4d9bd0; --brand-ink:#0b1520; --brand-tint:#16304a; --side:#0b1218; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
p { margin: 0; }
.hidden { display: none !important; }

.btn { display: inline-flex; align-items: center; gap: .4rem; border: 0; border-radius: 8px; padding: .55rem .95rem; font-weight: 600; font-size: .9rem; cursor: pointer; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-outline { background: var(--surface); border: 1px solid var(--line); }
.btn-ghost { background: transparent; color: var(--soft); padding: .4rem .6rem; }
.btn-ghost:hover { color: var(--ink); background: var(--brand-tint); }
.btn-danger { background: var(--red); color: #fff; }
.btn-sm { padding: .35rem .5rem; font-size: .82rem; }
.input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .55rem .7rem; font-size: .92rem; }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
textarea.input { min-height: 80px; resize: vertical; }
label.f { display: block; }
label.f > span { display: block; font-size: .83rem; font-weight: 600; margin-bottom: .3rem; }
label.f > span i { font-style: normal; font-weight: 400; color: var(--soft); }
label.f small { display: block; font-size: .76rem; color: var(--red); margin-top: .25rem; min-height: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .9rem; }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
.login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 2rem; }
.login-card h1 { font-size: 1.45rem; margin-top: 1rem; }
.login-card .sub { color: var(--soft); margin-top: .3rem; font-size: .92rem; }
.login-card form { display: grid; gap: .9rem; margin-top: 1.4rem; }
.alert { background: #fbebee; color: var(--red); border-radius: 8px; padding: .5rem .7rem; font-size: .86rem; }
.logo { display: flex; align-items: center; gap: .6rem; font-weight: 800; }
.logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: .95rem; flex: none; }

/* shell */
.shell { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--side) 230px, transparent 230px); }
aside.side { background: var(--side); color: var(--side-ink); padding: 1.2rem .9rem; display: flex; flex-direction: column; gap: 1.5rem; position: sticky; top: 0; height: 100vh; }
aside.side .logo { color: #fff; font-size: .92rem; line-height: 1.2; padding: 0 .4rem; }
aside.side .logo-mark { background: #f0b429; color: #14324a; }
nav.menu { display: grid; gap: .2rem; }
nav.menu button { text-align: left; background: none; border: 0; color: var(--side-ink); padding: .6rem .75rem; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; gap: .6rem; align-items: center; }
nav.menu button svg { width: 18px; height: 18px; opacity: .85; }
nav.menu button[aria-current="page"] { background: rgba(255,255,255,.12); color: #fff; }
.side-user { margin-top: auto; font-size: .82rem; padding: .7rem .75rem; border-top: 1px solid rgba(255,255,255,.12); }
.side-user b { display: block; color: #fff; }
.side-user button { margin-top: .5rem; background: none; border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 7px; padding: .3rem .7rem; font-size: .8rem; cursor: pointer; }
main.content { padding: 1.6rem 2rem 3rem; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
.head h1 { font-size: 1.55rem; font-weight: 800; }
.head p { color: var(--soft); margin-top: .2rem; font-size: .92rem; }
.head .actions { display: flex; gap: .5rem; }

  aside.side { position: static; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap; gap: .6rem; padding: .7rem 1rem; }
  nav.menu { display: flex; order: 3; width: 100%; overflow-x: auto; }
  .side-user { margin: 0 0 0 auto; border: 0; padding: 0; }
  .side-user b, .side-user span { display: none; }
  .side-user button { margin: 0; }
  main.content { padding: 1.2rem 1rem 3rem; }

.card-b { padding: 1rem 1.1rem; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1rem; }
.stat { padding: 1rem 1.1rem; }

.grid-dash { display: grid; grid-template-columns: 1.55fr 1fr; gap: 1rem; }
.stack { display: grid; gap: 1rem; align-content: start; }
@media (max-width: 1000px) { .stats { grid-template-columns: 1fr 1fr; } .grid-dash { grid-template-columns: 1fr; } }

/* tables */

table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .76rem; color: var(--soft); font-weight: 600; background: color-mix(in oklab, var(--bg) 70%, var(--surface)); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.title { white-space: normal; min-width: 170px; font-weight: 600; }
td.wrap { white-space: normal; min-width: 140px; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--brand-tint); }
.rank { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); font-weight: 700; font-size: .78rem; }
.muted { color: var(--soft); }

.tier { display: inline-flex; align-items: center; gap: .3rem; font-size: .76rem; font-weight: 700; padding: .15rem .55rem; border-radius: 999px; border: 1.5px solid currentColor; }

.tier.None { color: var(--soft); border-style: dashed; font-weight: 500; }
.tag { font-size: .76rem; padding: .12rem .5rem; border-radius: 6px; background: var(--bg); font-weight: 600; }

/* bars */
.bars { display: grid; gap: .55rem; }

.bar .track { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--brand); border-radius: 99px; }
.bar .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; }
.tier-box { border-radius: 10px; padding: .7rem; text-align: center; border: 1.5px solid currentColor; }
.tier-box .v { font-size: 1.5rem; font-weight: 800; color: var(--ink); }
.tier-box .l { font-size: .78rem; font-weight: 700; }
.tier-box.Bronze { color: var(--bronze); } .tier-box.Silver { color: var(--silver); } .tier-box.Gold { color: var(--gold); } .tier-box.Platinum { color: var(--platinum); }
.recent { list-style: none; margin: 0; padding: 0; }
.recent li { display: flex; justify-content: space-between; gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
.recent li:last-child { border-bottom: 0; }
.recent b { display: block; }
.pts { font-weight: 800; color: var(--brand); white-space: nowrap; }

.filters { display: flex; gap: .5rem; flex-wrap: wrap; padding: .9rem 1.1rem; border-bottom: 1px solid var(--line); }
.filters .input { width: auto; flex: 1 1 140px; }
.filters .search { flex: 3 1 220px; }
.filters input[type=date] { flex: 0 1 150px; }
.pager { display: flex; justify-content: space-between; align-items: center; padding: .7rem 1.1rem; border-top: 1px solid var(--line); font-size: .84rem; color: var(--soft); }
.pager div { display: flex; gap: .3rem; }

.profile { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; align-items: start; }
@media (max-width: 1000px) { .profile { grid-template-columns: 1fr; } }
.kv { display: grid; gap: .6rem; font-size: .9rem; }

.kv span { color: var(--soft); }
.big-points { font-size: 2.6rem; font-weight: 800; line-height: 1; }
.progress { height: 12px; background: var(--bg); border-radius: 99px; overflow: hidden; margin: .7rem 0 .4rem; }
.progress div { height: 100%; background: var(--brand); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 1.1rem; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 1.1rem 1rem; }
.timeline li::before { content: ""; position: absolute; left: -1.55rem; top: .35rem; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.timeline .d { font-size: .78rem; color: var(--soft); }
.timeline .t { font-weight: 700; }
.timeline .m { font-size: .84rem; color: var(--soft); margin-top: .1rem; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(12, 20, 30, .45); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
.modal { background: var(--surface); width: 100%; max-width: 560px; max-height: 94vh; overflow-y: auto; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
.modal-h { padding: 1rem 1.3rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }

.modal-b { padding: 1.2rem 1.3rem; display: grid; gap: .9rem; }
.modal-f { padding: .9rem 1.3rem; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: .5rem; }
.preview { background: var(--brand-tint); border-radius: 10px; padding: .7rem .9rem; display: flex; justify-content: space-between; align-items: center; font-size: .88rem; }
.preview b { font-size: 1.15rem; color: var(--brand); }
.picker { position: relative; }
.picker-list { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 24px rgba(0,0,0,.12); max-height: 200px; overflow-y: auto; z-index: 5; }
.picker-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: .5rem .7rem; cursor: pointer; font-size: .88rem; }
.picker-list button:hover { background: var(--brand-tint); }
.toast { position: fixed; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--side); color: #fff; padding: .6rem 1rem; border-radius: 8px; font-weight: 600; font-size: .9rem; z-index: 60; }
.empty { padding: 2.5rem 1rem; text-align: center; color: var(--soft); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

const pointsFor = (level, position) => Math.round((LEVEL_POINTS[level] || 0) * (POSITION_MULTIPLIER[position] || 0));
function tierFor(points) {
  for (const [name, min] of TIERS) if (points >= min) return name;
  return null;
}
function nextTier(points) {
  const asc = [...TIERS].reverse();
  const nxt = asc.find(([, min]) => points < min);

/* students */
const PAGE_S = 20, PAGE_A = 25;
function studentRows() {
  const t = totals(), q = S.sq.trim().toLowerCase();
  let rows = db.students.filter(s => (!q || s.name.toLowerCase().includes(q) || s.studentId.toLowerCase().includes(q)) && (!S.sgrade || s.grade === S.sgrade) && (!S.ssec || s.section === S.ssec)).map(s => ({ s, ...t[s.id] }));
  const sorts = { name: (a, b) => a.s.name.localeCompare(b.s.name), points: (a, b) => b.points - a.points, id: (a, b) => a.s.studentId.localeCompare(b.s.studentId), count: (a, b) => b.count - a.count };
  return rows.sort(sorts[S.ssort]);
}
function studentsView() {
  const grades = [...new Set(db.students.map(s => s.grade))].sort((a, b) => b - a), secs = [...new Set(db.students.map(s => s.section).filter(Boolean))].sort();
  return `

      </div>
      <div id="stable">${studentTable()}</div>
    </section>`;
}
function studentTable() {
  const rows = studentRows(), pages = Math.max(1, Math.ceil(rows.length / PAGE_S)); S.spage = Math.min(S.spage, pages);
  const slice = rows.slice((S.spage - 1) * PAGE_S, S.spage * PAGE_S);
  if (!rows.length) return `<div class="empty">No students match this search.</div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Student ID</th><th>Name</th><th>Class</th><th class="num">Achievements</th><th class="num">Total points</th><th>Award tier</th><th></th></tr></thead>
    <tbody>${slice.map(r => `<tr class="click" data-profile="${r.s.id}"><td>${esc(r.s.studentId)}</td><td><b>${esc(r.s.name)}</b></td><td>${cls(r.s)}</td><td class="num">${r.count}</td><td class="num"><b>${r.points}</b></td><td>${tierBadge(r.points)}</td>
      <td class="num"><button class="btn btn-ghost btn-sm" data-edit-stu="${r.s.id}">Edit</button><button class="btn btn-ghost btn-sm" data-del-stu="${r.s.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>
    ${pager(S.spage, pages, rows.length, PAGE_S, "s")}`;
}
function pager(p, pages, n, size, k) {
  return `<div class="pager"><span>Showing ${(p - 1) * size + 1}–${Math.min(p * size, n)} of ${n}</span><div>
    <button class="btn btn-outline btn-sm" data-page="${k}:${p - 1}" ${p <= 1 ? "disabled" : ""}>Previous</button>
    <span style="padding:.35rem .5rem">Page ${p} of ${pages}</span>
    <button class="btn btn-outline btn-sm" data-page="${k}:${p + 1}" ${p >= pages ? "disabled" : ""}>Next</button></div></div>`;
}

/* achievements */
function achRows() {
  const f = S.af, q = f.q.trim().toLowerCase();
  return db.achievements.filter(a => {
    const s = studentById(a.student);
    if (f.category && a.category !== f.category) return false;
    if (f.level && a.level !== f.level) return false;
    if (f.position && a.position !== f.position) return false;
    if (f.from && a.date < f.from) return false;
    if (f.to && a.date > f.to) return false;
    if (q && ![a.title, a.organizer, s?.name, s?.studentId].join(" ").toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date));
}
function achView() {
  const f = S.af;
  return `
    <div class="head"><div><h1>Achievements</h1><p>${db.achievements.length} achievements recorded. Points are calculated automatically.</p></div>

function achTable() {

/* bindings */
let debounce;
function bindView() {
  const c = $("main.content");
  c.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { S.view = b.dataset.nav; render(); });
  c.onclick = e => {
    const t = e.target.closest("button, tr");
    if (!t) return;
    if (t.matches("[data-edit-stu]")) return studentForm(studentById(t.dataset.editStu));
    if (t.matches("[data-del-stu]")) return confirmDel("student", t.dataset.delStu);
    if (t.matches("[data-edit-ach]")) return achForm(db.achievements.find(a => a.id === t.dataset.editAch));
    if (t.matches("[data-del-ach]")) return confirmDel("achievement", t.dataset.delAch);
    if (t.matches("[data-add-ach]")) return achForm(null, t.dataset.addAch || null);
    if (t.matches("[data-page]")) { const [k, p] = t.dataset.page.split(":"); if (k === "s") { S.spage = +p; $("#stable").innerHTML = studentTable(); } else { S.apage = +p; $("#atable").innerHTML = achTable(); } return; }
    if (t.id === "add-stu") return studentForm(null);
    if (t.id === "export") return exportCSV();
    if (t.matches("tr[data-profile]")) { S.profile = t.dataset.profile; S.view = "profile"; render(); }
  };
  const sf = $("#sf");
  if (sf) sf.oninput = e => { S[e.target.name] = e.target.value; S.spage = 1; clearTimeout(debounce); debounce = setTimeout(() => { $("#stable").innerHTML = studentTable(); }, e.target.name === "sq" ? 300 : 0); };
  const af = $("#af");
  if (af) af.oninput = e => { S.af[e.target.name] = e.target.value; S.apage = 1; clearTimeout(debounce); debounce = setTimeout(() => { $("#atable").innerHTML = achTable(); }, e.target.name === "q" ? 300 : 0); };
}

/* modals */
function modal(title, body, submitLabel, onSubmit, danger) {
  $("#modal").innerHTML = `<div class="overlay" id="ov"><form class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" novalidate>
    <div class="modal-h"><h2 id="mt">${title}</h2><button type="button" class="btn btn-ghost" data-close aria-label="Close">✕</button></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f"><button type="button" class="btn btn-outline" data-close>Cancel</button><button class="btn ${danger ? "btn-danger" : "btn-primary"}">${submitLabel}</button></div></form></div>`;
  const m = $("#modal form");
  $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") close(); });
  m.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  m.onsubmit = e => { e.preventDefault(); onSubmit(m); };
  const first = m.querySelector(".modal-b input, .modal-b select"); first && first.focus();
  return m;
}
const close = () => { $("#modal").innerHTML = ""; };
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

      <label class="f"><span>Section <i>(optional)</i></span><input class="input" name="section" value="${esc(s.section)}" maxlength="10" placeholder="e.g. A"><small data-err="section"></small></label>
    </div>
    <label class="f"><span>Email <i>(optional)</i></span><input class="input" name="email" type="email" value="${esc(s.email)}"><small data-err="email"></small></label>`,
    edit ? "Save changes" : "Add student", m => {
      const d = Object.fromEntries(new FormData(m));
      const v = { studentId: d.studentId.trim().toUpperCase(), name: d.name.trim(), grade: d.grade.trim(), section: d.section.trim().toUpperCase(), email: d.email.trim().toLowerCase() };
      const errs = {};
      if (!v.studentId) errs.studentId = "Student ID is required."; else if (db.students.some(x => x.studentId === v.studentId && x.id !== s.id)) errs.studentId = "That student ID is already in use.";
      if (!v.name) errs.name = "Full name is required.";
      if (!v.grade) errs.grade = "Grade is required.";
      if (v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) errs.email = "Enter a valid email address.";
      if (Object.keys(errs).length) return showErr(m, errs);
      if (edit) Object.assign(s, v); else db.students.push({ id: uid(), ...v, createdAt: new Date().toISOString() });
      save(); close(); render(); toast(edit ? "Student updated" : "Student added");
    });
}

function achForm(a, presetStudent) {
  const edit = !!a; a = a || { student: presetStudent || "", category: "", level: "", position: "", date: new Date().toISOString().slice(0, 10) };
  const st = studentById(a.student);
  const m = modal(edit ? "Edit achievement" : "Record achievement", `
    <label class="f"><span>Student</span><div class="picker">
      <input class="input" id="spick" placeholder="Search by name or student ID" autocomplete="off" value="${st ? esc(st.name + " (" + st.studentId + ")") : ""}">
      <input type="hidden" name="student" value="${esc(a.student)}"><div class="picker-list hidden" id="plist"></div></div><small data-err="student"></small></label>
    <label class="f"><span>Title</span><input class="input" name="title" maxlength="150" value="${esc(a.title)}" placeholder="e.g. State Athletics Meet - 400m"><small data-err="title"></small></label>
    <div class="row3">
      <label class="f"><span>Category</span><select class="input" name="category">${opts(CATEGORIES, a.category, "Select")}</select><small data-err="category"></small></label>
      <label class="f"><span>Level</span><select class="input" name="level">${opts(LEVELS, a.level, "Select")}</select><small data-err="level"></small></label>
      <label class="f"><span>Result</span><select class="input" name="position">${opts(POSITIONS, a.position, "Select")}</select><small data-err="position"></small></label>
    </div>
    <div class="row2">
      <label class="f"><span>Date</span><input class="input" type="date" name="date" value="${a.date}"><small data-err="date"></small></label>
      <label class="f"><span>Organizer <i>(optional)</i></span><input class="input" name="organizer" maxlength="150" value="${esc(a.organizer)}"></label>
    </div>
    <label class="f"><span>Notes <i>(optional)</i></span><textarea class="input" name="description" maxlength="1000">${esc(a.description)}</textarea></label>
    <div class="preview" id="pv"></div>`,
    edit ? "Save changes" : "Save achievement", m => {
      const d = Object.fromEntries(new FormData(m)), errs = {};
      if (!studentById(d.student)) errs.student = "Choose a student from the list.";
      if (!d.title.trim()) errs.title = "Title is required.";
      if (!CATEGORIES[d.category]) errs.category = "Select a category.";
      if (!LEVELS[d.level]) errs.level = "Select a level.";
      if (!POSITIONS[d.position]) errs.position = "Select a result.";
      if (!d.date) errs.date = "Date is required.";
      if (Object.keys(errs).length) return showErr(m, errs);
      const v = { student: d.student, title: d.title.trim(), category: d.category, level: d.level, position: d.position, date: d.date, organizer: d.organizer.trim(), description: d.description.trim(), points: pointsFor(d.level, d.position) };
      if (edit) Object.assign(a, v); else db.achievements.push({ id: uid(), ...v, createdAt: new Date().toISOString() });
      save(); close(); render(); toast(edit ? "Achievement updated" : `Achievement saved: ${v.points} points`);
    });
  const pv = $("#pv", m);
  const upd = () => {
    const l = m.level.value, p = m.position.value;
    pv.innerHTML = l && p ? `<span>${LEVELS[l]} (${LEVEL_POINTS[l]}) × ${POSITIONS[p]} (${POSITION_MULTIPLIER[p]})</span><b>${pointsFor(l, p)} points</b>` : `<span>Select a level and result to see the points.</span><b>—</b>`;
  };
  m.level.onchange = m.position.onchange = upd; upd();
  const inp = $("#spick", m), list = $("#plist", m);
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase(); m.student.value = "";
    const hits = db.students.filter(s => !q || s.name.toLowerCase().includes(q) || s.studentId.toLowerCase().includes(q)).slice(0, 8);
    list.innerHTML = hits.map(s => `<button type="button" data-pick="${s.id}">${esc(s.name)} <span class="muted">${esc(s.studentId)} · Grade ${cls(s)}</span></button>`).join("") || `<div class="empty" style="padding:.8rem">No student found</div>`;
    list.classList.remove("hidden");
  };
  inp.onfocus = inp.oninput;
  list.onmousedown = e => { const b = e.target.closest("[data-pick]"); if (!b) return; e.preventDefault(); const s = studentById(b.dataset.pick); m.student.value = s.id; inp.value = `${s.name} (${s.studentId})`; list.classList.add("hidden"); };
  inp.onblur = () => setTimeout(() => list.classList.add("hidden"), 120);
}

function confirmDel(kind, id) {
  const isS = kind === "student", item = isS ? studentById(id) : db.achievements.find(a => a.id === id);
  const n = isS ? db.achievements.filter(a => a.student === id).length : 0;
  modal(`Delete ${kind}?`, `<p>${isS ? `This deletes <b>${esc(item.name)}</b> and their ${n} achievement${n === 1 ? "" : "s"}.` : `This deletes <b>${esc(item.title)}</b>.`} This can’t be undone.</p>`, "Delete", () => {
    if (isS) { db.achievements = db.achievements.filter(a => a.student !== id); db.students = db.students.filter(s => s.id !== id); if (S.view === "profile") S.view = "students"; }
    else db.achievements = db.achievements.filter(a => a.id !== id);
    save(); close(); render(); toast(isS ? "Student deleted" : "Achievement deleted");
  }, true);
}

function exportCSV() {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["Student ID", "Student", "Grade", "Title", "Level", "Result", "Points"].map(q).join(",")];
  achRows().forEach(a => { const s = studentById(a.student); lines.push([s?.studentId, s?.name, s?.grade, a.title, a.level, a.position, a.points].map(q).join(",")); });
  const csv = lines.join("\n");
  (async () => {
    const dl = window.claude ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) { try { await dl.save({ filename: "achievements.csv", data: csv }); return; } catch { return; } }
    try { const u = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); const a = document.createElement("a"); a.href = u; a.download = "achievements.csv"; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); } catch { toast("Download is not available here"); }
  })();
}

(async () => {
  await load();
  try { const id = sessionStorage.getItem("saars_user"); const u = id && db.users.find(x => x.id === id); if (u) S.user = { id: u.id, name: u.name, email: u.email }; } catch {}
  render();
})();
</script>
</body>
</html>
